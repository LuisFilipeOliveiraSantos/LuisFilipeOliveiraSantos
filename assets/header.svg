<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <clipPath id="c">
      <rect width="900" height="220"/>
    </clipPath>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0A0A"/>
      <stop offset="50%" stop-color="#0D0B0E"/>
      <stop offset="100%" stop-color="#0A0A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E8A525" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0D0B0E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .star { animation: twinkle 3s ease-in-out infinite alternate; }
    .star-slow { animation: twinkle 5s ease-in-out infinite alternate; }
    .star-fast { animation: twinkle 1.8s ease-in-out infinite alternate; }
    .star:nth-child(2n) { animation-delay: 0.7s; }
    .star:nth-child(3n) { animation-delay: 1.4s; }
    .star:nth-child(5n) { animation-delay: 2.3s; }
    .star-slow:nth-child(2n) { animation-delay: 1.0s; }
    .star-fast:nth-child(3n) { animation-delay: 0.3s; }
    .shooting { animation: shoot 4s ease-in infinite; opacity: 0; }
    .shooting2 { animation: shoot2 6s ease-in 2s infinite; opacity: 0; }
    .line-left  { animation: drift-left  20s linear infinite; }
    .line-right { animation: drift-right 25s linear infinite; }
    .pulse { animation: glow-pulse 4s ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }
    @keyframes drift-left  { from { transform: translateX(0); } to { transform: translateX(-900px); } }
    @keyframes drift-right { from { transform: translateX(0); } to { transform: translateX(900px); } }
    @keyframes glow-pulse { from { opacity: 0.5; } to { opacity: 1; } }
    @keyframes shoot {
      0% { transform: translate(0, 0); opacity: 0; }
      5% { opacity: 1; }
      30% { transform: translate(120px, 40px); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes shoot2 {
      0% { transform: translate(0, 0); opacity: 0; }
      5% { opacity: 0.8; }
      25% { transform: translate(90px, 30px); opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star, .star-slow, .star-fast, .line-left, .line-right, .shooting, .shooting2, .pulse { animation: none; }
    }
  </style>

  <rect width="900" height="220" fill="url(#sunset)"/>
  <rect width="900" height="220" fill="url(#glow)"/>

  <g clip-path="url(#c)">
    <!-- Stars layer 1 - small dim -->
    <circle class="star" cx="45"  cy="22"  r="1.0" fill="#D4C5B0" opacity="0.5"/>
    <circle class="star" cx="130" cy="48"  r="0.7" fill="#D4C5B0" opacity="0.3"/>
    <circle class="star" cx="215" cy="12"  r="0.9" fill="#D4C5B0" opacity="0.4"/>
    <circle class="star" cx="310" cy="55"  r="0.6" fill="#D4C5B0" opacity="0.3"/>
    <circle class="star" cx="440" cy="18"  r="0.8" fill="#D4C5B0" opacity="0.4"/>
    <circle class="star" cx="555" cy="42"  r="0.7" fill="#D4C5B0" opacity="0.3"/>
    <circle class="star" cx="640" cy="10"  r="1.0" fill="#D4C5B0" opacity="0.5"/>
    <circle class="star" cx="735" cy="52"  r="0.6" fill="#D4C5B0" opacity="0.3"/>
    <circle class="star" cx="810" cy="28"  r="0.8" fill="#D4C5B0" opacity="0.4"/>
    <circle class="star" cx="875" cy="60"  r="0.7" fill="#D4C5B0" opacity="0.3"/>

    <!-- Stars layer 2 - medium golden -->
    <circle class="star-slow" cx="80"  cy="65"  r="1.3" fill="#E8A525" opacity="0.5"/>
    <circle class="star-slow" cx="260" cy="35"  r="1.1" fill="#E8A525" opacity="0.4"/>
    <circle class="star-slow" cx="380" cy="8"   r="1.4" fill="#E8A525" opacity="0.6"/>
    <circle class="star-slow" cx="500" cy="58"  r="1.0" fill="#E8A525" opacity="0.4"/>
    <circle class="star-slow" cx="690" cy="25"  r="1.2" fill="#E8A525" opacity="0.5"/>
    <circle class="star-slow" cx="850" cy="45"  r="1.1" fill="#E8A525" opacity="0.4"/>

    <!-- Stars layer 3 - bright fast -->
    <circle class="star-fast" cx="170" cy="30"  r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <circle class="star-fast" cx="460" cy="45"  r="1.3" fill="#FFFFFF" opacity="0.6"/>
    <circle class="star-fast" cx="750" cy="15"  r="1.4" fill="#FFFFFF" opacity="0.5"/>

    <!-- Shooting stars -->
    <line class="shooting" x1="200" y1="20" x2="210" y2="23" stroke="#E8A525" stroke-width="1.5" stroke-linecap="round"/>
    <line class="shooting2" x1="650" y1="35" x2="658" y2="37" stroke="#D4C5B0" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Horizon lines drifting -->
    <g class="line-left" fill="none" stroke="#3D3226" stroke-width="0.8">
      <path opacity="0.3" d="M 0,180 Q 225,174 450,180 Q 675,186 900,180 Q 1125,174 1350,180 Q 1575,186 1800,180"/>
      <path opacity="0.5" d="M 0,190 Q 225,183 450,190 Q 675,197 900,190 Q 1125,183 1350,190 Q 1575,197 1800,190"/>
    </g>
    <g class="line-right" fill="none" stroke="#3D3226" stroke-width="0.8">
      <path opacity="0.4" d="M -900,200 Q -675,193 -450,200 Q -225,207 0,200 Q 225,193 450,200 Q 675,207 900,200"/>
      <path opacity="0.25" d="M -900,210 Q -675,204 -450,210 Q -225,216 0,210 Q 225,204 450,210 Q 675,216 900,210"/>
    </g>
  </g>

  <!-- Name -->
  <text x="450" y="95"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="46" font-weight="500" letter-spacing="-0.02em"
    fill="#D4C5B0" text-anchor="middle">Luis Filipe</text>

  <!-- Handle -->
  <text x="450" y="122"
    font-family="'Courier New', Consolas, 'Liberation Mono', monospace"
    font-size="13" font-weight="400" letter-spacing="0.10em"
    fill="#E8A525" text-anchor="middle" class="pulse">LuisFilipeOliveiraSantos</text>

  <!-- Tagline -->
  <text x="450" y="150"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="12" font-weight="400" font-style="italic"
    fill="#7A6E5D" text-anchor="middle">Backend &amp; Full-Stack Developer ~ Recife, BR</text>
</svg>
